name: Prepare release candidate artifacts

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Calendar Versioning release identifier (does not create a tag or release)
        required: true
        default: v26.10.05
        type: string
      source_sha:
        description: Optional exact SHA; defaults to the workflow dispatch ref HEAD
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  stage:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve source SHA and validate inputs
        id: resolve
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${REQUESTED_SHA:-${DISPATCH_SHA}}"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "Resolved source SHA must be a full lowercase commit SHA." >&2; exit 1; }
          if [[ "${RELEASE_VERSION}" =~ ^v([0-9]{2})\.([0-9]{2})\.([0-9]{2})(\.[1-9][0-9]*)?$ ]]; then
            version_date="20${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
            date -d "${version_date}" +%F >/dev/null 2>&1 || { echo "release_version contains an invalid calendar date." >&2; exit 1; }
            [[ "$(date -d "${version_date}" +%y.%m.%d)" == "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" ]] || { echo "release_version contains an invalid calendar date." >&2; exit 1; }
          else
            echo "release_version must use vYY.MM.DD or vYY.MM.DD.N Calendar Versioning." >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Preparing ${RELEASE_VERSION} from ${SOURCE_SHA}; no tag or GitHub Release will be created." >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out the exact source commit for archive validation
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.source_sha }}
          submodules: recursive

      - name: Download all six ZIPs from successful exact-SHA platform workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          while IFS='|' read -r workflow artifact filename; do
            run_id="$(gh run list --repo "${GH_REPO}" --workflow "${workflow}" --commit "${SOURCE_SHA}" --limit 50 --json databaseId,headSha,conclusion --jq "[.[] | select(.headSha == \"${SOURCE_SHA}\" and .conclusion == \"success\")] | first | .databaseId // empty")"
            [[ -n "${run_id}" ]] || { echo "No successful ${workflow} run exists for exact SHA ${SOURCE_SHA}." >&2; exit 1; }
            destination="${RUNNER_TEMP}/${filename}.download"
            mkdir -p "${destination}"
            gh run download "${run_id}" --repo "${GH_REPO}" --name "${artifact}" --dir "${destination}"
            mapfile -t files < <(find "${destination}" -maxdepth 1 -type f -printf '%f\n')
            [[ "${#files[@]}" -eq 1 && "${files[0]}" == "${filename}" ]] || { echo "${artifact} did not contain exactly ${filename}." >&2; exit 1; }
            mv "${destination}/${filename}" "release-candidate/${filename}"
          done <<'EOF'
          windows-package.yml|WizRust101-RPC-Windows-Setup.zip|WizRust101-RPC-Windows-Setup.zip
          windows-package.yml|WizRust101-RPC-Windows-Portable.zip|WizRust101-RPC-Windows-Portable.zip
          macos-check.yml|WizRust101-RPC-macOS-App.zip|WizRust101-RPC-macOS-App.zip
          macos-check.yml|WizRust101-RPC-macOS-Pkg.zip|WizRust101-RPC-macOS-Pkg.zip
          linux-package.yml|WizRust101-RPC-Linux-Flatpak.zip|WizRust101-RPC-Linux-Flatpak.zip
          linux-package.yml|WizRust101-RPC-Linux-AppImage.zip|WizRust101-RPC-Linux-AppImage.zip
          EOF

      - name: Validate ZIP payloads and generate checksums
        run: |
          set -euo pipefail
          bash scripts/verify-release-archives.sh release-candidate
          cd release-candidate
          sha256sum \
            WizRust101-RPC-Windows-Setup.zip \
            WizRust101-RPC-Windows-Portable.zip \
            WizRust101-RPC-macOS-App.zip \
            WizRust101-RPC-macOS-Pkg.zip \
            WizRust101-RPC-Linux-Flatpak.zip \
            WizRust101-RPC-Linux-AppImage.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      # Each uploaded artifact contains the exact user-downloadable ZIP, without another wrapper.
      # This workflow only stages files; it never creates a tag or GitHub Release.
      - name: Stage Windows setup ZIP
        uses: actions/upload-artifact@v7
        with:
          name: WizRust101-RPC-Windows-Setup.zip
          path: release-candidate/WizRust101-RPC-Windows-Setup.zip
          archive: false
          if-no-files-found: error
      - name: Stage Windows portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: WizRust101-RPC-Windows-Portable.zip
          path: release-candidate/WizRust101-RPC-Windows-Portable.zip
          archive: false
          if-no-files-found: error
      - name: Stage macOS app ZIP
        uses: actions/upload-artifact@v7
        with:
          name: WizRust101-RPC-macOS-App.zip
          path: release-candidate/WizRust101-RPC-macOS-App.zip
          archive: false
          if-no-files-found: error
      - name: Stage macOS pkg ZIP
        uses: actions/upload-artifact@v7
        with:
          name: WizRust101-RPC-macOS-Pkg.zip
          path: release-candidate/WizRust101-RPC-macOS-Pkg.zip
          archive: false
          if-no-files-found: error
      - name: Stage Linux Flatpak ZIP
        uses: actions/upload-artifact@v7
        with:
          name: WizRust101-RPC-Linux-Flatpak.zip
          path: release-candidate/WizRust101-RPC-Linux-Flatpak.zip
          archive: false
          if-no-files-found: error
      - name: Stage Linux AppImage ZIP
        uses: actions/upload-artifact@v7
        with:
          name: WizRust101-RPC-Linux-AppImage.zip
          path: release-candidate/WizRust101-RPC-Linux-AppImage.zip
          archive: false
          if-no-files-found: error
      - name: Stage SHA-256 manifest
        uses: actions/upload-artifact@v7
        with:
          name: WizRust101-RPC-SHA256SUMS.txt
          path: release-candidate/SHA256SUMS.txt
          archive: false
          if-no-files-found: error
