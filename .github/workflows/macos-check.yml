name: macOS checks and packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run native macOS tests
        run: cargo test --locked --all-targets
      - name: Run warning-denied Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  packages:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      WIZRUST101_MACOS_ARCH: universal2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Require official release ID
        shell: bash
        env:
          WIZRUST101_RELEASE_DISCORD_APP_ID: ${{ secrets.WIZRUST101_RELEASE_DISCORD_APP_ID }}
        run: |
          if [[ ! "${WIZRUST101_RELEASE_DISCORD_APP_ID}" =~ ^[0-9]+$ ]]; then
            echo "WIZRUST101_RELEASE_DISCORD_APP_ID Actions secret is missing or invalid." >&2
            exit 1
          fi
      - name: Build unsigned app and installer
        env:
          WIZRUST101_RELEASE_DISCORD_APP_ID: ${{ secrets.WIZRUST101_RELEASE_DISCORD_APP_ID }}
        run: bash scripts/build-macos.sh "$RUNNER_TEMP/macos-package"
      - name: Validate shipped app, package, architectures, and embedded ID
        env:
          WIZRUST101_CI_EXPECTED_APP_ID: ${{ secrets.WIZRUST101_RELEASE_DISCORD_APP_ID }}
        run: bash scripts/verify-macos-package.sh "$RUNNER_TEMP/macos-package" universal2
      - name: Upload app ZIP and installer
        uses: actions/upload-artifact@v4
        with:
          name: WizRust101-RPC-macOS-universal2
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/macos-package/WizRust101-RPC-universal2.app.zip
            ${{ runner.temp }}/macos-package/WizRust101-RPC-universal2.pkg
