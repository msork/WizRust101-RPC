name: macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: universal2
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      WIZRUST101_RELEASE_DISCORD_APP_ID: "000000000000000000"
      WIZRUST101_MACOS_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build unsigned app and installer for validation
        run: |
          scripts/build-macos.sh "$RUNNER_TEMP/macos-package"
          plutil -lint packaging/macos/Info.plist
          pkgutil --payload-files "$RUNNER_TEMP/macos-package/WizRust101-RPC-${{ matrix.arch }}.pkg"
          ARCHS="$(lipo -archs "$RUNNER_TEMP/macos-package/WizRust101-RPC.app/Contents/MacOS/wizrust101-rpc")"
          echo "App architectures: ${ARCHS}"
          case "${{ matrix.arch }}:${ARCHS}" in
            arm64:arm64|x86_64:x86_64|universal2:*arm64*x86_64*|universal2:*x86_64*arm64*) ;;
            *) echo "Unexpected app architectures for ${{ matrix.arch }}: ${ARCHS}" >&2; exit 1 ;;
          esac
