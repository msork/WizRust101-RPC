name: Windows checks and packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run native Windows tests
        run: cargo test --locked --all-targets
      - name: Run warning-denied Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  packages:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
      - name: Build and validate separate Windows ZIPs
        shell: pwsh
        env:
          WIZRUST101_RELEASE_DISCORD_APP_ID: ${{ secrets.WIZRUST101_RELEASE_DISCORD_APP_ID }}
        run: ./scripts/build-windows.ps1
      - name: Upload Windows setup ZIP without an extra wrapper
        uses: actions/upload-artifact@v7
        with:
          name: WizRust101-RPC-Windows-Setup.zip
          if-no-files-found: error
          archive: false
          path: target/windows-installer/WizRust101-RPC-Windows-Setup.zip
      - name: Upload Windows portable ZIP without an extra wrapper
        uses: actions/upload-artifact@v7
        with:
          name: WizRust101-RPC-Windows-Portable.zip
          if-no-files-found: error
          archive: false
          path: target/windows-installer/WizRust101-RPC-Windows-Portable.zip
