[package]
name = "wizrust101-rpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Wizard101 log ingestion for Discord Rich Presence"
license = "MIT"

[lib]
name = "wizrust101_rpc"
path = "src/lib.rs"

[[bin]]
name = "wizrust101-rpc"
path = "src/main.rs"

[[bin]]
name = "import-bacon-zones"
path = "src/bin/import_bacon_zones.rs"

[dependencies]
directories = "6.0"
discord-rich-presence = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.1.1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.12.3"
ksni = { version = "0.3.6", features = ["blocking"] }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.18"
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
tray-icon = { version = "0.26.0", default-features = false, features = ["muda-common-controls-v6"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
winit = { version = "0.30.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
png = "0.18"
rfd = { version = "0.17.2", default-features = false }
tray-icon = { version = "0.26.0", default-features = false }
winit = { version = "0.30.13", default-features = false }

[build-dependencies]
embed-manifest = "1.5.1"

[dev-dependencies]
tempfile = "3"
