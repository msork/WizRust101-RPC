[package]
name = "wizrust101-rpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Wizard101 log ingestion for Discord Rich Presence"
license = "MIT"

[lib]
name = "wizrust101_rpc"
path = "src/lib.rs"

[[bin]]
name = "wizrust101-rpc"
path = "src/main.rs"

[[bin]]
name = "import-bacon-zones"
path = "src/bin/import_bacon_zones.rs"

[dependencies]
discord-rich-presence = "1.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamlocate = "2.1.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
